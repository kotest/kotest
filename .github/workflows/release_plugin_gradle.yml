name: release_plugin_gradle
run-name: Releasing Kotest Gradle Plugin ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Ad-hoc release only - normal releases run this automatically via release_all. Leave blank for snapshot."
        required: false
  workflow_call:
    inputs:
      version:
        description: "The release version (leave blank for snapshot)"
        required: false
        type: string
      ref:
        description: "The git branch, tag or SHA to checkout"
        required: false
        type: string

env:
  GRADLE_RELEASE: ${{ inputs.version }}
  GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
  GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

permissions:
  contents: read

jobs:
  release-plugin:
    runs-on: ubuntu-latest
    if: github.repository == 'kotest/kotest'

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version-file: .github/.java-version

      - uses: gradle/actions/setup-gradle@v6

      - name: deploy to gradle
        run: ./gradlew :kotest-framework:kotest-framework-plugin-gradle:publishPlugins
