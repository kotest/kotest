name: test-release-bump-pr
run-name: Test kotest-skills plugin bump PR creation

on:
   pull_request:
      paths:
         - '.github/workflows/release_all.yml'
         - '.github/workflows/test_release_bump_pr.yml'

permissions:
   contents: write
   pull-requests: write

jobs:
   test-bump:
      runs-on: ubuntu-latest
      steps:
         -  uses: actions/checkout@v6
            with:
               ref: ${{ github.event.pull_request.head.sha }}
               fetch-depth: 0
         -  name: Bump kotest-skills plugin version (test)
            shell: bash
            env:
               GH_TOKEN: ${{ github.token }}
            run: |
               set -euo pipefail
               VERSION="0.0.0-test-${{ github.run_id }}"
               BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
               BUMP_BRANCH="release-bot/bump-kotest-skills-plugin-${VERSION}"
               jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > /tmp/plugin.json
               mv /tmp/plugin.json .claude-plugin/plugin.json
               jq --arg v "$VERSION" '.metadata.version = $v' .claude-plugin/marketplace.json > /tmp/marketplace.json
               mv /tmp/marketplace.json .claude-plugin/marketplace.json
               git config --global user.email "sam@sksamuel.com"
               git config --global user.name "Kotest Release Bot"
               git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
               if git diff --cached --quiet; then
                 echo "kotest-skills plugin already at ${VERSION}; nothing to commit."
               else
                 git checkout -b "${BUMP_BRANCH}"
                 git commit -m "Bump kotest-skills plugin version to ${VERSION}"
                 git push origin "${BUMP_BRANCH}"
                 gh pr create \
                   --base "${BASE_BRANCH}" \
                   --head "${BUMP_BRANCH}" \
                   --title "[TEST] Bump kotest-skills plugin version to ${VERSION}" \
                   --body "Test run of the release-bump PR flow (workflow run ${{ github.run_id }}). Safe to close/delete branch after verifying."
               fi
